kind = "mobile"
previewPath = "/mobile/"
title = "Pumpi Mobile"
description = "The Pumpi mobile app for iOS and Android. Lets users sign in with email OTP or Google, then trade and track tokens on the go. Email auth is the first feature — the app stores the session token securely using expo-secure-store so users stay signed in across launches."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
